{% extends "base.html" %}

{% block conteudo %}

<div class="container-form">

    <h1>Login</h1>

    <form method="POST">

        <label>E-mail</label>

        <input
            type="email"
            name="email"
            required>

        <label>Senha</label>

        <input
            type="password"
            name="senha"
            required>

        <button>

            Entrar

        </button>

        {% if erro %}

            <div class="erro">

                {{ erro }}

            </div>

         {% endif %} 

    </form>

</div>

<div class="bnt-trocar-senha">
    
    <form>

        <button> Esqueci a Senha </button>

    </form>

    

</div>


{% endblock %}
