    {% extends "base.html" %}

{% block conteudo %}

<div class="container-admin">

    <h1>Painel Administrativo</h1>

    <a class="btn-novo" href="#">
       + Novo Produto
    </a>

    <table class="tabela-admin">

        <thead>

            <tr>

                <th>ID</th>
                <th>Produto</th>
                <th>Preço</th>
                <th>Ações</th>

            </tr>

        </thead>

        <tbody>

        {% for produto in produtos %}

            <tr>

                <td>{{ produto.id }}</td>

                <td>{{ produto.nome }}</td>

                <td>R$ {{ "%.2f"|format(produto.preco) }}</td>

                <td>

                    <button>Editar</button>

                    <button>Excluir</button>

                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
