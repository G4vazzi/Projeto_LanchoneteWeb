{% extends "base.html" %}

{% block conteudo %}

<div class="container-form">

<h1>Novo Produto</h1>

<form method="POST" enctype="multipart/form-data">

    <label>Nome</label>

    <input
        type="text"
        name="nome"
        required
    >

    <label>Descrição</label>

    <textarea
        name="descricao"
        rows="5"
        required
    ></textarea>

    <label>Preço</label>

    <input
        type="number"
        step="0.01"
        name="preco"
        required
    >

    <label>Imagem</label>

    <input
        type="file"
        name="imagem"
        accept="image/*"
        required
    >

    <button type="submit">

        Salvar Produto

    </button>

</form>

</div>

{% endblock %}
