{% extends "base.html" %}

{% block conteudo %}

<div class="container-form">

    <h1>Editar Produto</h1>

    <form method="POST" enctype="multipart/form-data">

        <label>Nome</label>

        <input
            type="text"
            name="nome"
            value="{{ produto.nome }}"
            required
        >

        <label>Descrição</label>

        <textarea
            name="descricao"
            rows="5"
            required
        >{{ produto.descricao }}</textarea>

        <label>Preço</label>

        <input
            type="number"
            step="0.01"
            name="preco"
            value="{{ produto.preco }}"
            required
        >

        <label>Imagem</label>

        <input
            type="file"
            name="imagem"
            accept="image/*"
        >

        <button type="submit">
            Salvar Alterações
        </button>

    </form>

</div>

{% endblock %}
