{% extends "base.html" %}

{% block conteudo %}

<div class="container-form">

    <h1>Criar Conta</h1>

    <form method="POST">

        <label>Nome</label>

        <input
            type="text"
            name="nome"
            required>

        <label>E-mail</label>

        <input
            type="email"
            name="email"
            required>

        <label>Telefone</label>

        <input
            type="text"
            name="telefone"
            required>

        <label>Endereço</label>

        <input
            type="text"
            name="endereco"
            required>

        <label>Senha</label>

        <input
            type="password"
            name="senha"
            required>

        <label>Confirmar Senha</label>

        <input
            type="password"
            name="confirmar"
            required>

        <button>

            Criar Conta

        </button>

    </form>

</div>

{% endblock %}
