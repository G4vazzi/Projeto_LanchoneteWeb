{% extends "base.html" %}

{% block conteudo %}

<div class="container-form">

<h1>Login</h1>

<form method="POST">

<label>Usuário</label>

<input
type="text"
name="usuario"
required>

<label>Senha</label>

<input
type="password"
name="senha"
required>

<button>

Entrar

</button>

{% if erro %}

<p style="color:red">

{{ erro }}

</p>

{% endif %}

</form>

</div>

{% endblock %}
