{% extends "base.html" %}

{% block conteudo %}

<h1>Pedidos</h1>

<table>

    <tr>

        <th>ID</th>
        <th>Cliente</th>
        <th>Telefone</th>
        <th>Total</th>
        <th>Status</th>
        <th>Ações</th>

    </tr>

    {% for pedido in pedidos %}

    <tr>

        <td>{{ pedido.id }}</td>

        <td>{{ pedido.cliente }}</td>

        <td>{{ pedido.telefone }}</td>

        <td>

            R$ {{ "%.2f"|format(pedido.total) }}

        </td>

        <td>

            {{ pedido.status }}

        </td>
        
        <td>

        <a href="{{ url_for('pedidos.visualizar_pedido', id_pedido=pedido.id) }}">

            Ver Pedido

        </a>
        
        </td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
